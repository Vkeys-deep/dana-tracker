name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Release Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install PNPM karena project kamu pakai pnpm
      - name: Set up PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 2. Install dependencies langsung di dalam folder artifacts/rdpt-app
      - name: Install dependencies
        working-directory: artifacts/rdpt-app
        run: pnpm install

      # 3. Build React Vite di dalam folder artifacts/rdpt-app
      - name: Build React (Vite)
        working-directory: artifacts/rdpt-app
        run: pnpm run build

      # 4. Set up Java buat ngerakit Android-nya
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Inisialisasi & sinkronisasi Capacitor CLI di dalam folder artifacts/rdpt-app
      - name: Install Capacitor CLI & Android platform
        working-directory: artifacts/rdpt-app
        run: |
          npx cap init "RDPT Insight" "com.rdpt.insight" --web-dir=dist 2>/dev/null || true
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: artifacts/rdpt-app
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/rdpt-app/android/**/*.gradle*', 'artifacts/rdpt-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Proses rakit APK Android-nya
      - name: Build Debug APK
        working-directory: artifacts/rdpt-app/android
        run: ./gradlew assembleDebug --no-daemon

      # 7. Upload hasilnya biar bisa kamu download di HP
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpt-insight-debug-apk
          path: artifacts/rdpt-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        working-directory: artifacts/rdpt-app
        run: |
          echo "APK tersedia di tab Actions → Artifacts → rdpt-insight-debug-apk"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true
