name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Release Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # 1. Pasang PNPM dengan versi Actions terbaru
      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 2. Install dependencies langsung di dalam folder artifacts/rdpt-app
      - name: Install dependencies
        working-directory: artifacts/rdpt-app
        run: pnpm install --no-frozen-lockfile

      # 3. Build React Vite di dalam folder artifacts/rdpt-app
      - name: Build React (Vite)
        working-directory: artifacts/rdpt-app
        run: pnpm run build

      # 4. Set up Java buat ngerakit Android-nya (LTS Terstabil)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Sinkronisasi Capacitor CLI di dalam folder artifacts/rdpt-app
      - name: Install Capacitor CLI & Android platform
        working-directory: artifacts/rdpt-app
        run: |
          pnpm add -D @capacitor/cli
          pnpm add @capacitor/core @capacitor/android
          pnpm exec cap init "RDPT Insight" "com.rdpt.insight" --web-dir=dist || true
          pnpm exec cap add android || true
          pnpm exec cap sync android

      # 6. Cache Gradle biar proses build kedepannya makin ngebut
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/rdpt-app/android/**/*.gradle*', 'artifacts/rdpt-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 7. Generate ulang Gradle Wrapper resmi dari server biar file .jar & script-nya lengkap penuh!
      - name: Generate and Make Gradle wrapper executable
        working-directory: artifacts/rdpt-app/android
        run: |
          gradle wrapper --gradle-version 8.0 --distribution-type bin
          chmod +x gradlew

      # 8. Jalankan Gradle buat ngerakit APK
      - name: Build Debug APK
        working-directory: artifacts/rdpt-app/android
        run: ./gradlew assembleDebug --no-daemon

      # 9. Upload hasil APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpt-insight-debug-apk
          path: artifacts/rdpt-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        working-directory: artifacts/rdpt-app
        run: |
          echo "APK tersedia di tab Actions → Artifacts → rdpt-insight-debug-apk"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || true
